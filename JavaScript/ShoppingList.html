<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShoppyCart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {

            --glossy-blue: linear-gradient(180deg, #74ebd5 0%, #9face6 100%);
            --button-blue: #4a90e2;
            --text-blue: #2c3e50;
        }

        body {

            background:
                radial-gradient(circle at 20% 30%, rgba(74, 222, 128, 0.4) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(0, 195, 255, 0.4) 0%, transparent 40%),
                url('https://i.ytimg.com/vi/-TaRL--y9Xc/maxresdefault.jpg');
            background-size: cover;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            font-family: 'Inter', 'Segoe UI', sans-serif;
        }

        .cart-container {
            max-width: 420px;
            margin: auto;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            padding: 25px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
        }

        .heading {
            color: var(--button-blue);
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .form-control {
            border-radius: 15px;
            border: 1.5px solid #e1e8ed;
            padding: 10px 20px;
            font-size: 0.95rem;
        }

        .form-control:focus {
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.2);
            border-color: var(--button-blue);
        }

        #addButton {
            background: var(--glossy-blue);
            border: none;
            border-radius: 15px;
            color: white;
            font-weight: 600;
            padding: 10px 20px;
            transition: all 0.2s;
            box-shadow: 0 4px 10px rgba(159, 172, 230, 0.4);
        }

        #addButton:hover {
            transform: translateY(-2px);
            filter: brightness(1.05);
        }


        .list-group-item {
            background: white;
            margin-bottom: 8px;
            border-radius: 15px !important;
            border: 1px solid #f0f4f8;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 18px;
            transition: 0.2s;
        }

        .item-text {
            color: var(--text-blue);
            font-weight: 500;
        }

        .remove-btn {
            background: #fff0f3;
            color: #ff4d6d;
            border: none;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 5px 12px;
            border-radius: 10px;
            transition: 0.2s;
        }

        .remove-btn:hover {
            background: #ff4d6d;
            color: white;
        }


        #spinner {
            display: none;
            width: 1rem;
            height: 1rem;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="cart-container">
            <div class="text-center mb-4">
                <h3 class="heading"> ShoppyCart 🫧</h3>
                <p class="text-muted small">Your shopping list</p>
            </div>

            <form id="myForm" class="mb-3">
                <div class="input-group gap-2"> <input id="myInput" type="text" class="form-control"
                        placeholder="Add something waffles, pancakes..." required>
                    <button id="addButton" type="submit">
                        <span id="btnText">Add</span>
                        <div id="spinner" class="spinner-border spinner-border-sm" role="status"></div>
                    </button>
                </div>
            </form>

            <div class="mb-2 mt-4 d-flex justify-content-between align-items: center;">
                <h6 class="text-muted small fw-bold uppercase">TO BUY:</h6>
            </div>

            <ul id="myItem" class="list-group list-group-flush">
            </ul>
        </div>
    </div>

    <script>
        const myForm = document.getElementById("myForm");
        const myInput = document.getElementById("myInput");
        const myItem = document.getElementById("myItem");
        const btnText = document.getElementById("btnText");
        const spinner = document.getElementById("spinner");
        const addButton = document.getElementById("addButton");

        myForm.addEventListener("submit", (e) => {
            e.preventDefault();

            // Show loading state
            btnText.style.display = "none";
            spinner.style.display = "inline-block";
            addButton.disabled = true;

            setTimeout(() => {
                const text = myInput.value;
                const li = document.createElement("li");
                li.className = "list-group-item shadow-sm";
                li.innerHTML = `
                    <span class="item-text">${text}</span>
                    <button class="remove-btn" onclick="this.parentElement.remove()">✕</button>
                `;

                myItem.prepend(li);

                // Reset UI
                myInput.value = '';
                btnText.style.display = "inline-block";
                spinner.style.display = "none";
                addButton.disabled = false;
                myInput.focus();
            }, 400);
        });
    </script>
</body>

</html>
