<!DOCTYPE html>
<html>

<head>
    <title>Counter Application</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
           
            background: url('https://xmple.com/wallpaper/squares-blue-checkered-purple-5120x2880-c2-483d8b-191970-l-110-a-20-f-2.svg');
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            margin: 0;
        }

        .container-card {
            background: white;
            border: 3px solid #276187;
            border-radius: 20px;
            padding: 40px 60px;
            text-align: center;
            box-shadow: 10px 10px 0px #276187;
        }

        .label {
            font-size: 18px;
            display: block;
            letter-spacing: 6px;
            text-transform: uppercase;
            margin-bottom: 10px;
            color: #214861;
            font-weight: bold;
        }

        #counter-display {
            font-size: 6rem;
            font-weight: bold;
            display: block;
            margin-bottom: 20px;
            color: #333;
        }

        .btn {
            margin: 5px;
            min-width: 100px;
            font-weight: 600;
            border-radius: 10px;
        }

      
        .btn-outline-primary {
            border-color: #4b92c1;
            color: #4b92c1;
        }

        .btn-outline-primary:hover {
            background-color: #0099ff;
            color: white;
        }

        .btn-outline-danger {
            border-color: #308697;
            color: #308697;
        }

        .btn-outline-danger:hover {
            background-color: #2d6975;
            color: white;
            border-color: #2d6975;
        }

        .btn-outline-warning {
            border-color: #426e84;
            color: #426e84;
        }

        .btn-outline-warning:hover {
            background-color: #29acee;
            color: white;
            border-color: #29acee;
        }
    </style>
</head>

<body>

    <div class="container-card">
        <span class="label">Counter App</span>
        <span id="counter-display">0</span>

        <div class="button-group">
            <button id="btn-increase" class="btn btn-outline-primary">INCREASE</button>
            <button id="btn-decrease" class="btn btn-outline-danger">DECREASE</button>
            <button id="btn-reset" class="btn btn-outline-warning">RESET</button>
        </div>
    </div>

    <script>
        window.onload = function () {
            
            var count = 0;
            var display = document.getElementById("counter-display");
            var btnIncrease = document.getElementById("btn-increase");
            var btnDecrease = document.getElementById("btn-decrease");
            var btnReset = document.getElementById("btn-reset");

            // Increase 
            btnIncrease.onclick = function () {
                count++;
                display.innerHTML = count;
                updateColor();
            }

            // Decrease
            btnDecrease.onclick = function () {
                count--;
                display.innerHTML = count;
                updateColor();
            }

            // Reseting
            btnReset.onclick = function () {
                count = 0;
                display.innerHTML = count;
                display.style.color = "#333"; }

           
            function updateColor() {
                if (count > 0) {
                    display.style.color = "#0d6efd"; 
                } else if (count < 0) {
                    display.style.color = "#dc3545"; 
                } else {
                    display.style.color = "#333";
                }
            }
        }
    </script>

</body>

</html>
