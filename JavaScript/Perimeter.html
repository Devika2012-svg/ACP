<!DOCTYPE html>
<html>
    <head><title>Finding Perimeter</title></head>

    <body>
        <script>
            var choice = prompt("\n 1. Perimeter of Equilateral Triangle. \n 2. Perimeter of Rectangle. \n 3. Perimeter of Square. \n 4. Perimeter of Circle. \n 5. Perimter of Parallelogram. \n 6. Perimter of Regular Polygon")

            if (choice == '1') {

                var s = prompt("Enter the side length: ");
                var result = Number(s) * 3
                alert("The area is " + result)

            }

            if (choice == '2') {

                var l = Number(prompt("Enter length of the rectangle:"));
                var b = Number(prompt("Enter breadth of the rectangle:"));
                var perimeter = 2 * (l + b);
                alert("The perimeter is " + perimeter);

            }

            if (choice == '3') {

                    var s = prompt("Enter length of the square:");
                    var result = Number(s) * 4
                    alert("The Area is " + result)
                }
            
            if (choice == '4') {

                    var r = prompt("Enter radius of the circle:");
                    var result = Number(r) * 3.14 * 2
                    alert("The Area is " + result)
                }

             if (choice == '5') {

                    var a = Number(prompt("Enter length of one side of the parallelogram:"));
                    var b = Number(prompt("Enter length of the other side of the parallelogram:"));

                    var result = 2 * (a + b);

                    alert("The Perimeter is " + result);

                }

            if (choice == '6') {

                    var s = prompt("Enter the side length: ");
                    var n = prompt("Enter number of sides: ")
                    var result = Number(s) * Number(n)
                    alert("The area is " + result)

                }
            
        </script>
    </body>
</html>
